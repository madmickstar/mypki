# Pre-commit: the same rules CI enforces, run locally before a commit rather than after a push.
#
# CI does NOT run pre-commit — it runs `ruff check` and `ruff format --check` directly (see .github/workflows/ci.yml), so
# contributors who never install pre-commit are gated by identical rules. This file exists so the failures arrive on the
# contributor's machine instead of in a red X on a pull request.
#
# Order matters and is not cosmetic: `ruff --fix` rewrites code, and `ruff-format` then normalises what ruff changed. Run
# them the other way round and a format-clean file comes back from the fixer unformatted, so every commit needs a second
# pass — which is how people start committing with `--no-verify`.
#
# `language: python` + explicit `additional_dependencies` pins the linter version pre-commit installs in its own isolated
# environment. Without it, pre-commit resolves its own ruff (silently newer than the venv's) and reports findings that the
# project's pinned `ruff>=0.4` never produces locally — a gate nobody can reproduce is a gate people route around.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      # `--fix` only for rules with unambiguous fixes; ruff's own default set of fixable rules is what the project's
      # `select = [E,F,I,UP,B,C4,SIM,RUF]` in pyproject.toml is evaluated against, so no rule list is duplicated here.
      - id: ruff
        args: [--fix]
        additional_dependencies: [ruff==0.17.2]
      - id: ruff-format
        additional_dependencies: [ruff==0.17.2]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Trailing whitespace in a Python file is invisible until it makes a diff noisy; in a markdown table it makes the table
      # render wrong. Cheap to enforce, and never a judgement call.
      - id: trailing-whitespace
      # A missing final newline makes every tool that appends a line produce a spurious diff on the first change, and git
      # renders it as "\ No newline at end of file" in every patch a reviewer then has to read past.
      - id: end-of-file-fixer
      # Two YAML files carry this project's whole release contract (this one and .github/workflows/ci.yml), and a broken
      # workflow file fails at trigger time rather than at commit time — which is the worst moment to discover it.
      - id: check-yaml
      # A committed 5 MB PEM is the single most likely way this repository could leak a key, and no other hook here catches
      # it: content filters look for text patterns, not for size. 200 kB is well above every source file in the tree and
      # well below anything a certificate or database accident produces.
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: destroyed-symlinks

  - repo: local
    hooks:
      # The version chain runs locally too, because the drift it catches (a bumped __version__ with no CHANGELOG section) is
      # cheapest to fix in the commit that caused it and most expensive to discover on a release tag. `entry` points at the
      # script rather than an installed console entry point so it works in a checkout where mypki is not installed — the
      # same property CI's version job depends on.
      - id: check-version-chain
        name: version chain (module -> manifest -> CHANGELOG)
        entry: python3 tools/check_version.py
        language: system
        files: ^(src/mypki/__init__\.py|pyproject\.toml|CHANGELOG\.md)$
        pass_filenames: false

      # There is deliberately no harness hook here. The end-to-end harness mints a throwaway CA, binds an ephemeral port and
      # spawns a server, which is minutes of work rather than a per-file check; `tools/harness_parity.py` (which compared two
      # harness logs) and `tools/harness_ledger.py` (which rebuilt counts from a log) are deleted with the two harnesses they
      # needed. The harness is gated instead: `make gate` runs it last.
