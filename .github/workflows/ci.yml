name: CI

# Triggers. `push` is scoped to main so a feature branch does not burn a four-OS × four-version matrix on every commit;
# tags are what run the release path, and the pattern must match the tag convention check_version.py enforces (`vX.Y.Z`).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# Read-only is all any job here needs: nothing in this workflow writes back to the repository, and a token that could is a
# larger blast radius for a compromised dependency than the one this project can absorb.
permissions:
  contents: read

# Cancel an in-flight run for the same ref rather than queueing a second one. Without it, three pushes in two minutes produce
# three matrices and the third one — the only one that reflects what was actually pushed — finishes last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Action versions: `actions/checkout@v5` and `actions/setup-python@v6`.
#
# The first GitHub run printed a deprecation warning on every job — "Node.js 20 is deprecated … forced to run on Node.js
# 24: actions/checkout@v4, actions/setup-python@v5". A warning, not a failure: the jobs still ran and still reported real
# results, which is exactly why it is worth clearing rather than learning to skim past it. A log whose known noise is
# ignored is a log where the *next* warning is also ignored, and the whole reason this workflow exists is that a green CI
# must be readable to be trusted.
#
# Chosen by reading each tag's own manifest rather than by bumping to "latest": checkout v4 declares `using: node20` while
# v5/v6/v7 declare `node24`; setup-python v5 declares `node20` while v6/v7 declare `node24`. So v5/v6 are the first majors
# that stop asking for a runtime GitHub now overrides — the smallest change that silences it, in the same spirit as
# `permissions: contents: read` above.
#
# Why not the newest majors. checkout v7 adds a behavior change (it refuses to check out fork PRs under
# `pull_request_target` / `workflow_run`) and an ESM migration; setup-python v7 removes the `pip-install` input. Neither
# affects this file today — no `pull_request_target`, no `pip-install` — but adopting them would be taking on changes this
# project has no demand for, and every input actually used here (`fetch-depth`, `python-version`, `cache`,
# `cache-dependency-path`) is present in v5/v6, checked against the two `action.yml` files directly.
#
# One caveat carried forward: both majors require runner v2.327.1 or newer. GitHub-hosted runners (`ubuntu-latest`, the
# `windows-latest` legs below) are always at or past that, so nothing to do here — but a self-hosted runner added later
# must be updated first, or these steps fail before any test runs.

jobs:
  # ------------------------------------------------------------------ lint
  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev extras
        run: pip install -e ".[dev]"

      # `src tests tools` — tools/ is linted for the same reason it is shipped in the sdist: check_version.py is a program
      # people depend on to tell them whether a release is consistent, and an unlinted checker is a checker whose bugs are
      # discovered by whoever is trying to cut a release at 23:00. Linting it costs one path argument; not linting it costs
      # the tool's credibility.
      # The same target a contributor runs locally, so CI cannot be green on a command the repository does not use.
      - name: Ruff check
        run: make lint

      # `format --check` rather than `format`: CI that rewrites files reports success while leaving the repository dirty, and
      # the next contributor cannot tell which of their lines a tool moved. Formatting is a contributor-side action (via
      # pre-commit or `ruff format` locally); CI only verifies it happened.
      # `make lint` already ran both halves; this job stays separate so a format failure is visible as its own leg rather
      # than being hidden behind whichever of the two commands CI happened to reach first.
      - name: Ruff format check
        run: ruff format --check src tests tools

  # ------------------------------------------------------------------ types
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev extras
        run: pip install -e ".[dev]"

      # `mypy src` only, deliberately not `mypy src tests`. The value of typing here is concentrated in the modules that
      # touch cryptography objects and paths — ca.py, csr.py, signing.py, validators.py, store.py — where a wrong type is a
      # wrong certificate. Tests are the freedom to construct awkward fixtures on purpose; forcing annotations on every
      # throwaway dict and monkeypatched env would buy no safety and would make each new negative test cost two edits, which
      # is how negative coverage gets skipped. `tools/` is excluded for a different reason: check_version.py is stdlib-only
      # by contract and asserted to stay that way in tests/test_version.py, so it needs no project-wide typing configuration
      # to be correct about itself.
      - name: mypy on the package
        run: make types

  # ------------------------------------------------------------------ tests
  pytest:
    name: pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: false — a Windows-only path bug is the most likely defect this project has (it is the reason one code
      # path serves both OSes), and a matrix that cancels on the first Linux failure hides it. Every leg reports its own
      # result even when another leg is red.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev extras
        run: pip install -e ".[dev]"

      # The Windows leg is what proves two claims this project makes out loud: that path handling (XDG on POSIX,
      # %LOCALAPPDATA% on Windows, pathlib only, no shell) works from one code path, and that NO OpenSSL binary is required
      # anywhere — every certificate operation goes through `cryptography`, which ships cp39-abi3 win_amd64 wheels, so a
      # green run on windows-latest with no toolchain installed is the assertion itself. If this leg ever needs an extra
      # install step, that is a regression in the design rather than in the environment.
      #
      # --cov-fail-under=85 fails the job below the project's floor; the per-module ≥95% expectation for ca.py/csr.py/
      # signing.py/validators.py is checked locally and visible in the term report, because a global average can hide an
      # untested signing path behind well-tested CLI plumbing.
      # No `--cov-fail-under` here: the floor is declared once in [tool.coverage.report] in pyproject.toml, so a run that
      # forgot the floor is no longer possible. The XML report is CI-only and is why this does not call `make cov`.
      - name: pytest
        run: python -m pytest --cov=mypki --cov-report=xml

  # ------------------------------------------------------------------ the e2e harness: deliberately NOT a job here either
  # `tools/e2e_harness.py` mints a throwaway CA, binds an ephemeral port, spawns a server and walks sixteen sections of live HTTP,
  # which costs minutes per push on a runner that would also need its ports unshared. It is the last step of `make gate`, so every
  # commit owes it locally; CI's legs stay lint / types / pytest / version chain, and this comment is what stops a green CI from
  # being read as harness evidence. The parity tool that used to sit in this comment (`tools/harness_parity.py`, comparing two
  # harness logs heading for heading) is deleted with the two harnesses it needed — with one harness there is nothing left to
  # compare, and its exit-2 'could not check' contract has no inputs to refuse.

  # ------------------------------------------------------------------ version chain
  version:
    name: Version chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 — actions/checkout does NOT fetch tags by default, and this job's whole subject is refs/tags.
          # Without this, `--require-tag` would report "no annotated tag v0.1.0 exists" on a run that was triggered *by*
          # the tag v0.1.0: a false drift accusation against the one ref that proves the chain.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No `pip install` step, on purpose. check_version.py imports nothing from mypki and is stdlib-only (asserted in
      # tests/test_version.py), so the version guard runs against the source tree as checked out. Installing the package to
      # check its version would mean the artifact with the wrong version had already been built by the time the checker
      # spoke — which is the exact ordering this job exists to invert.
      - name: Version chain (module -> manifest -> CHANGELOG)
        run: make version

      # `--require-tag` only on a tag ref. MEASURED on this project's own tree: check_version.py exits **2** ("cannot
      # check") when the version line exists but no release ref can be consulted, and 2 is explicitly not a pass — so
      # running the tag link on an ordinary branch commit would fail every push to main for a reason that has nothing to
      # do with the code. The gate is `startsWith(github.ref,'refs/tags/v')`, which matches the `on: tags:` trigger above:
      # the tag link runs exactly when there is a tag to check.
      - name: Version chain includes the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/check_version.py --require-tag
